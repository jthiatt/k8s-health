# Local test overlay: the agent with checks that exist on a plain minikube, plus one that must fail.
# Needs the Splunk OTel Collector installed first (see otel-values.yaml and the README's "Testing on minikube").
# It lives inside the base's directory, which kustomize treats as a cycle for `resources: [../..]`, so it
# references the base files directly. Render with:
#   kubectl kustomize --load-restrictor LoadRestrictionsNone test/minikube | kubectl apply -f -
namespace: eks-status
resources:
  - ../../agent.yaml
configMapGenerator:
  - name: eks-health-agent
    files: [agent.py=../../agent.py, checks.json]
patches:
  - target: {kind: Deployment, name: eks-health-agent}
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: minikube
