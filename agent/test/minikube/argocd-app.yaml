# Hello-world Argo CD app for testing the agent's Argo CD checks on minikube: Argo CD's own public
# guestbook example (kustomize variant, so the image can be overridden to break it on purpose).
# Once Argo CD manages an app, the application-controller exports argocd_app_info / argocd_app_sync_total
# and the repo-server makes git requests, which the agent forwards to Splunk.
#   kubectl apply -f test/minikube/argocd-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: guestbook
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/argoproj/argocd-example-apps.git
    targetRevision: master
    path: kustomize-guestbook
  destination:
    server: https://kubernetes.default.svc
    namespace: guestbook
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
