apiVersion: v1
kind: Namespace
metadata:
  name: eks-status
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eks-health-agent
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eks-health-agent
rules:
  - apiGroups: ["apps"]
    resources: [deployments, statefulsets, daemonsets]
    verbs: [get]
  - apiGroups: [""]
    resources: [pods]  # metrics checks discover pods by selector
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eks-health-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: eks-health-agent
subjects:
  - kind: ServiceAccount
    name: eks-health-agent
    namespace: eks-status
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eks-health-agent
spec:
  replicas: 1
  selector:
    matchLabels: {app: eks-health-agent}
  template:
    metadata:
      labels: {app: eks-health-agent}
    spec:
      serviceAccountName: eks-health-agent
      securityContext: {runAsNonRoot: true, runAsUser: 65534}
      containers:
        - name: agent
          image: python:3.12-slim
          command: ["python", "/app/agent.py"]
          env:
            - {name: CLUSTER_NAME, value: CHANGE-ME}  # patch per cluster
            - {name: INTERVAL_SECONDS, value: "60"}   # status page's INTERVAL_SECONDS must match
            - name: SPLUNK_OTEL_AGENT  # node IP; the Splunk OTel Collector agent listens on :9943 there
              valueFrom: {fieldRef: {fieldPath: status.hostIP}}
          volumeMounts: [{name: app, mountPath: /app}]
          securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 64Mi}
      volumes:
        - name: app
          configMap: {name: eks-health-agent}
