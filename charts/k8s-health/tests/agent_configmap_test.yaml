suite: agent checks config (agent-configmap.yaml)
templates:
  - templates/agent-configmap.yaml
set:
  clusterName: test
tests:
  - it: renders the core kubernetes service with the API server, DNS and node checks
    asserts:
      - matchRegex: {path: 'data["checks.json"]', pattern: '"apiserver": "/readyz\?verbose"'}
      - matchRegex: {path: 'data["checks.json"]', pattern: '(?s)"aggregate": \{\s*"apiserver_flowcontrol_rejected_requests_total": \[\]'}
      - matchRegex: {path: 'data["checks.json"]', pattern: '(?s)"pod_scheduling": \{\s*"first_window_seconds": 60,\s*"max_pending_seconds": 300,\s*"threshold_seconds": 5'}
      - matchRegex: {path: 'data["checks.json"]', pattern: '"dns": "kubernetes.default.svc.cluster.local."'}
      - matchRegex: {path: 'data["checks.json"]', pattern: '"max_not_ready": 0'}
      - matchRegex: {path: 'data["checks.json"]', pattern: '(?s)"kubernetes": \{\s*"checks": \[.*?\],\s*"mode": "always"'}
  - it: uses a custom cluster domain and extra DNS names
    set:
      agent.core.clusterDomain: corp.local
      agent.core.extraDnsNames: [example.com.]
    asserts:
      - matchRegex: {path: 'data["checks.json"]', pattern: '"dns": "kubernetes.default.svc.corp.local."'}
      - matchRegex: {path: 'data["checks.json"]', pattern: '"dns": "example.com."'}
  - it: uses the configured interval as the first scheduling window and custom SLO settings
    set:
      intervalSeconds: 30
      agent.core.podScheduling.thresholdSeconds: 3
      agent.core.podScheduling.maxPendingSeconds: 120
    asserts:
      - matchRegex: {path: 'data["checks.json"]', pattern: '(?s)"pod_scheduling": \{\s*"first_window_seconds": 30,\s*"max_pending_seconds": 120,\s*"threshold_seconds": 3'}
  - it: leaves out core checks that are turned off, and the whole core service when all are
    set:
      agent.core.apiserver: false
      agent.core.apiserverMetrics: false
      agent.core.podScheduling.enabled: false
      agent.core.dns: false
      agent.core.nodes.enabled: false
    asserts:
      - notMatchRegex: {path: 'data["checks.json"]', pattern: '"kubernetes":'}
  - it: reports add-on profiles in auto mode by default
    asserts:
      - matchRegex: {path: 'data["checks.json"]', pattern: '(?s)"argocd": \{\s*"checks": \[.*?\],\s*"mode": "auto"'}
  - it: "enabled: true means always, enabled: false leaves the profile out"
    set:
      agent.profiles.argocd.enabled: true
      agent.profiles.traefik.enabled: false
    asserts:
      - matchRegex: {path: 'data["checks.json"]', pattern: '(?s)"argocd": \{\s*"checks": \[.*?\],\s*"mode": "always"'}
      - notMatchRegex: {path: 'data["checks.json"]', pattern: '"traefik":'}
  - it: includes a profile's metrics scrapes only when its metrics toggle is on
    asserts:
      - notMatchRegex: {path: 'data["checks.json"]', pattern: '"port": 9962'}  # cilium metrics off by default
      - matchRegex: {path: 'data["checks.json"]', pattern: '"port": 8082'}     # argocd metrics on by default
  - it: includes the KEDA profile, with its metrics scrape off until KEDA's own metrics are enabled
    asserts:
      - matchRegex: {path: 'data["checks.json"]', pattern: '(?s)"keda": \{\s*"checks": \[.*?"name": "keda-operator".*?\],\s*"mode": "auto"'}
      - notMatchRegex: {path: 'data["checks.json"]', pattern: 'keda_scaled_object_errors_total'}
  - it: scrapes KEDA's operator metrics when its metrics toggle is on
    set:
      agent.profiles.keda.metrics: true
    asserts:
      - matchRegex: {path: 'data["checks.json"]', pattern: 'keda_scaled_object_errors_total'}
  - it: includes the Kyverno profile, aggregating its per-policy metrics
    asserts:
      - matchRegex: {path: 'data["checks.json"]', pattern: '(?s)"kyverno": \{\s*"checks": \[.*?"name": "kyverno-admission-controller".*?\],\s*"mode": "auto"'}
      - matchRegex: {path: 'data["checks.json"]', pattern: '(?s)"aggregate": \{.*?"kyverno_policy_results_total": \[\s*"rule_result"\s*\]'}
  - it: includes the Prometheus profile, found by label in any namespace
    asserts:
      - matchRegex: {path: 'data["checks.json"]', pattern: '(?s)"prometheus": \{\s*"checks": \[\s*\{\s*"kind": "deployment",\s*"selector": "app.kubernetes.io/component=prometheus-operator"'}
      - matchRegex: {path: 'data["checks.json"]', pattern: '(?s)"min": \{\s*"alertmanager_config_last_reload_successful": 1'}
  - it: includes the Envoy Gateway profile, with proxy scrapes optional until a Gateway exists
    asserts:
      - matchRegex: {path: 'data["checks.json"]', pattern: '(?s)"envoy-gateway": \{\s*"checks": \[.*?"name": "envoy-gateway".*?\],\s*"mode": "auto"'}
      - matchRegex: {path: 'data["checks.json"]', pattern: '(?s)"optional": true,\s*"path": "/stats/prometheus",\s*"port": 19001'}
  - it: includes the OpenTelemetry Operator profile, with collector scrapes optional
    asserts:
      - matchRegex: {path: 'data["checks.json"]', pattern: '"selector": "app.kubernetes.io/name=opentelemetry-operator,app.kubernetes.io/component=controller-manager"'}
      - matchRegex: {path: 'data["checks.json"]', pattern: '(?s)"optional": true,\s*"port": 8888,\s*"selector": "app.kubernetes.io/managed-by=opentelemetry-operator'}
  - it: includes the CloudNativePG profile, requiring Postgres up on every instance
    asserts:
      - matchRegex: {path: 'data["checks.json"]', pattern: '(?s)"cloudnative-pg": \{\s*"checks": \[\s*\{\s*"kind": "deployment",\s*"selector": "app.kubernetes.io/name=cloudnative-pg"'}
      - matchRegex: {path: 'data["checks.json"]', pattern: '(?s)"min": \{\s*"cnpg_collector_up": 1'}
      - matchRegex: {path: 'data["checks.json"]', pattern: '(?s)"max": \{\s*"cnpg_last_error": 0'}
  - it: includes the Falco profile, with metrics off by default
    asserts:
      - matchRegex: {path: 'data["checks.json"]', pattern: '(?s)"falco": \{\s*"checks": \[\s*\{\s*"kind": "daemonset",\s*"selector": "app.kubernetes.io/name=falco"\s*\}\s*\]'}
  - it: aggregates Falco rule matches by priority when metrics are on
    set:
      agent.profiles.falco.metrics: true
    asserts:
      - matchRegex: {path: 'data["checks.json"]', pattern: '(?s)"falcosecurity_falco_rules_matches_total": \[\s*"priority"\s*\]'}
  - it: includes the Gatekeeper profile, requiring a recent audit run
    asserts:
      - matchRegex: {path: 'data["checks.json"]', pattern: '(?s)"gatekeeper": \{\s*"checks": \[.*?"name": "gatekeeper-audit".*?\],\s*"mode": "auto"'}
      - matchRegex: {path: 'data["checks.json"]', pattern: '(?s)"max_age": \{\s*"gatekeeper_audit_last_run_end_time": 900'}
  - it: includes the Istio profile, covering istiod and gateways in any namespace
    asserts:
      - matchRegex: {path: 'data["checks.json"]', pattern: '(?s)"istio": \{\s*"checks": \[\s*\{\s*"kind": "deployment",\s*"selector": "app.kubernetes.io/part-of=istio"'}
      - matchRegex: {path: 'data["checks.json"]', pattern: '"port": 15014'}
  - it: includes the Linkerd profile, failing on an expired issuer certificate
    asserts:
      - matchRegex: {path: 'data["checks.json"]', pattern: '(?s)"linkerd": \{\s*"checks": \[.*?"name": "linkerd-identity".*?\],\s*"mode": "auto"'}
      - matchRegex: {path: 'data["checks.json"]', pattern: '(?s)"min": \{\s*"issuer_cert_ttl_seconds": 0'}
  - it: includes the metrics-server profile, checking its APIService
    asserts:
      - matchRegex: {path: 'data["checks.json"]', pattern: '(?s)"metrics-server": \{\s*"checks": \[.*?"apiservice": "v1beta1.metrics.k8s.io".*?\],\s*"mode": "auto"'}
  - it: includes the cert-manager profile, scraping only the controller
    asserts:
      - matchRegex: {path: 'data["checks.json"]', pattern: '(?s)"cert-manager": \{\s*"checks": \[.*?"name": "cert-manager-webhook".*?\],\s*"mode": "auto"'}
      - matchRegex: {path: 'data["checks.json"]', pattern: '"selector": "app.kubernetes.io/name=cert-manager,app.kubernetes.io/component=controller"'}
  - it: includes the fluentd profile, found by label in any namespace
    asserts:
      - matchRegex: {path: 'data["checks.json"]', pattern: '(?s)"fluentd": \{\s*"checks": \[\s*\{\s*"kind": "daemonset",\s*"selector": "app.kubernetes.io/name=fluentd"'}
      - matchRegex: {path: 'data["checks.json"]', pattern: '"port": 24231'}
      - matchRegex: {path: 'data["checks.json"]', pattern: '(?s)"fluentd_input_status_num_records_total": \[\s*\]'}
  - it: includes the ARC profile, with listener scrapes optional until scale sets exist
    set:
      agent.profiles.arc.metrics: true
    asserts:
      - matchRegex: {path: 'data["checks.json"]', pattern: '"selector": "app.kubernetes.io/name=gha-rs-controller"'}
      - matchRegex: {path: 'data["checks.json"]', pattern: '(?s)"optional": true,\s*"port": 8080,\s*"selector": "app.kubernetes.io/component=runner-scale-set-listener"'}
  - it: turns Cilium metrics on when asked
    set:
      agent.profiles.cilium.metrics: true
    asserts:
      - matchRegex: {path: 'data["checks.json"]', pattern: '"port": 9962'}
  - it: adds extraServices, defaulting to always
    set:
      agent.extraServices:
        payments: {checks: [{kind: deployment, namespace: pay, name: gw}]}
        optional: {enabled: auto, checks: [{dns: x.}]}
    asserts:
      - matchRegex: {path: 'data["checks.json"]', pattern: '(?s)"payments": \{\s*"checks": \[.*?\],\s*"mode": "always"'}
      - matchRegex: {path: 'data["checks.json"]', pattern: '(?s)"optional": \{\s*"checks": \[.*?\],\s*"mode": "auto"'}
  - it: rejects an invalid enabled value
    set:
      agent.profiles.argocd.enabled: sometimes
    asserts:
      - failedTemplate: {errorPattern: "agent.profiles.argocd.enabled must be auto, true or false"}
  - it: renders nothing when the agent is disabled
    set:
      agent.enabled: false
    asserts:
      - hasDocuments: {count: 0}
